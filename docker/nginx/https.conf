server {
  listen 80;
  server_name iivm6.cit.tum.de _;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name iivm6.cit.tum.de;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  ssl_certificate /etc/nginx/certs/iivm6.cit.tum.de.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/iivm6.cit.tum.de.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location /api/ {
    proxy_pass http://haic-api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /HAIC_study {
    try_files /index.html =404;
  }

  location = /HAIC_study/ {
    try_files /index.html =404;
  }

  location = /HAIC_study/assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
